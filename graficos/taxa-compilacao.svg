<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Taxa de compilação</title>
<desc id="desc">Gráfico de barras comparando Respostas que compilaram; percentual das 30 para Phi-4 Mini, Gemma 3 e Mistral. Os valores estão escritos sobre as barras.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="100" y="38" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#18212b">Taxa de compilação</text>
<text x="100" y="66" font-family="Arial, sans-serif" font-size="15" fill="#52606d">Respostas que compilaram; percentual das 30</text>
<line x1="100" y1="456.0" x2="912" y2="456.0" stroke="#d8dee5" stroke-width="1"/>
<text x="88" y="461.0" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#46515c">0%</text>
<line x1="100" y1="365.0" x2="912" y2="365.0" stroke="#d8dee5" stroke-width="1"/>
<text x="88" y="370.0" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#46515c">25%</text>
<line x1="100" y1="274.0" x2="912" y2="274.0" stroke="#d8dee5" stroke-width="1"/>
<text x="88" y="279.0" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#46515c">50%</text>
<line x1="100" y1="183.0" x2="912" y2="183.0" stroke="#d8dee5" stroke-width="1"/>
<text x="88" y="188.0" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#46515c">75%</text>
<line x1="100" y1="92.0" x2="912" y2="92.0" stroke="#d8dee5" stroke-width="1"/>
<text x="88" y="97.0" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#46515c">100%</text>
<rect x="179.3" y="261.9" width="112.0" height="194.1" rx="3" fill="#3267a8"/>
<text x="235.3" y="251.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#18212b">53.3%</text>
<text x="235.3" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#18212b">Phi-4 Mini</text>
<rect x="450.0" y="176.9" width="112.0" height="279.1" rx="3" fill="#cf7b22"/>
<text x="506.0" y="166.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#18212b">76.7%</text>
<text x="506.0" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#18212b">Gemma 3</text>
<rect x="720.7" y="249.7" width="112.0" height="206.3" rx="3" fill="#287a58"/>
<text x="776.7" y="239.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#18212b">56.7%</text>
<text x="776.7" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#18212b">Mistral 7B Instruct</text>
<line x1="100" y1="456" x2="912" y2="456" stroke="#46515c" stroke-width="1.5"/>
</svg>